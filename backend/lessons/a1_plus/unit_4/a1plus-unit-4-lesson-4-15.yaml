  "grammar_function": "A follow-up of A1 4.15 More at Home: A1 names more of the home; A1+ 4.15 adds some and any to 4.4's there is, there are and Are there…?: some in a positive sentence (There are some apples on the table.), any in a question and after aren't (Are there any books on the sofa? No, there aren't any.), with How many … are there? Six new Flash photos show three places with the things and the same places without them (each empty photo is an edit of its full one), and A1 4.4's books on a table and bags under a table come back. An any sentence is never set against a photo of another place, where it would also be true.",
