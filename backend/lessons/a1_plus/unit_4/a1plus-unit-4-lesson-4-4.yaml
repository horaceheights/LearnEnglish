  "grammar_function": "A follow-up of A1 4.4 There Is and There Are: A1 says there is and there are; A1+ 4.4 asks with them. The one new grammar relationship is the question with be before there (Is there a lamp in the living room? / Are there two chairs in the dining room?) and its short answers (Yes, there is. / No, there isn't. / Yes, there are. / No, there aren't.), with How many … are there? for counting. A1 4.4's room photos answer the questions, and a No answer is only asked about a photo that plainly does not show the thing (no TV and no computer in A1's bedroom; three books, not four). A1+ 2.9's buses, men and women come back with How many … are there?. A negative sentence is never set against a photo in a picture bank.",
  "prerequisite": "A1 4.4 there is and there are; A1 4.1-4.3 rooms and places; A1+ 2.9 buses, men, women; A1+ 3.4 short answers.",
  "speaking_outcome": "Link is there (IZ-ther) and are there (AR-ther); stress the not in isn't and aren't. Do not require native-like speed.",
