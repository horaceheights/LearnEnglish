  "grammar_function": "A follow-up of A1 4.8 Do you…? Questions and replies: A1 asks Do you…? about habits; A1+ 4.8 asks about the past with Did, the past form of do (Did you clean the kitchen? Yes, I did. / No, I didn't.), and Did she…? after A1+ 1.9's Does she…?. After did the verb is the base form, so any taught verb can be asked (Did you find your phone?), irregular ones included, under the user's 2026-11-13 decision. A1 4.8's photos of Ana and Luis at a café show Ana's answer with a thumb up or down; A1 4.11's photos of Ana cooking, using the computer and finding her phone show what she did; A1 4.7's photos show the mother and the boy. Listen sets Did against Do and Does, and short-answer banks set did against do.",
  "prerequisite": "A1 4.8 Do you…? Yes, I do. No, I do not.; A1+ 1.9 Does she…?; A1+ 4.7 the past with -ed.",
  "speaking_outcome": "Say did with a short i (DID) and didn't as one beat (DID-nt). Do not require native-like speed.",
