  "grammar_function": "A follow-up of A1 7.3 My Clothes: A1 names clothes and their colors (My shirt is red.); A1+ 7.3 says what someone is wearing now. The one new grammar relationship is am/is/are + wearing + clothes (Luis is wearing a black jacket. / I'm wearing a red shirt.), with the question What are you wearing? / What is she wearing?. It uses A1+ 3.3's he's/she's + -ing. Four new photos dress the cast in one clear piece each, and A1's photos of a red hat, a hat and shorts, boots and a red scarf come back. Two clothes are new and are taught inside the same frame: a T-shirt and jeans (Luis is wearing a blue T-shirt. / Ana is wearing jeans.); jeans takes no a, like boots and shorts.",
  "prerequisite": "A1 7.3 clothes and colors; A1 7.5 boots, scarf and shorts; A1+ 3.3 he's/she's + -ing.",
  "speaking_outcome": "Say wearing as WAIR-ing with the stress on the first part, and join I'm wearing (aim-WAIR-ing); say T-shirt as TEE-shirt and jeans with a clear j (JEENZ). Do not require native-like speed.",
