  "grammar_function": "A follow-up of A1 3.10 My, Your, His, and Her: A1 puts my, your, his and her before a name or a thing (his phone); A1+ 3.10 uses his and her to describe people. The one new grammar relationship is possessive + hair or eyes + be + a description (Her hair is long. / His eyes are green.), taught against A1+ 1.1's has + a description + noun (She has long hair. / He has green eyes.); eyes takes are. Three new close portraits show short and long hair and blue, green and brown eyes; A1+ 1.1's photos of Ana (long hair) and Luis (short hair) come back. A bank never sets one long-haired woman against another.",
  "prerequisite": "A1 3.10 his and her; A1 7.1 eyes; A1 2.8 and 2.13 blue, green, brown; A1+ 1.1 long and short hair and has; A1+ 3.3 she's.",
  "speaking_outcome": "Say hair with no h-drop and eyes as one syllable (aiz); keep his and her short. Do not require native-like speed.",
