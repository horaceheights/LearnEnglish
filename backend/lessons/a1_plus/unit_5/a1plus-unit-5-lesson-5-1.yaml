  "grammar_function": "A follow-up of A1 5.1 Fruits: A1 names fruit and counts it with numbers (three apples); A1+ 5.1 says the amount without a number: a lot of for a big amount and a few for a small one, both before a plural (There are a lot of apples. / There are a few apples.), and a lot of before fruit as a whole (Diego eats a lot of fruit.). The photos show a big heap against three pieces of the same fruit, so each picture shows one amount. How many … are there? (A1 5.4) asks, and the reply gives the amount.",
  "prerequisite": "A1 5.1 fruit, apples, oranges, strawberries, bananas; A1 3.12 has; A1 5.4 How many … are there?; A1+ 1.2 eats.",
  "speaking_outcome": "Join a lot of into one phrase (a-LOT-of, of very short) and stress few in a few; do not require native-like speed.",
