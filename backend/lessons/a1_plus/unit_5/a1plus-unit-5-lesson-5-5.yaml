  "grammar_function": "A follow-up of A1 5.5 Likes, Dislikes, and Agreement: A1 agrees with Me too. and Me neither.; A1+ 5.5 gives the forms that repeat the helping verb: So do I. after I like … and Neither do I. after I don't like …. Both are learnt as fixed replies. Each photo shows two cast members who both smile at a food or both push it away; the first line decides the reply. The pairs are Ana and Luis, Sofia and Diego, Diego and Ana, and Luis and Sofia, because Ana and Sofia share one voice, as do Luis and Diego.",
  "prerequisite": "A1 5.5 I like …, I don't like …, Me too., Me neither.; A1 5.1-5.3 strawberries, fish, coffee, milk.",
