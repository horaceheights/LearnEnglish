  "grammar_function": "A follow-up of A1 5.4 How Many? and Some: A1 asks How many … are there? and counts; A1+ 5.4 asks about a food or drink you do not count, with How much + the food + is there? (How much milk is there?), and answers with 5.1-5.2's a lot of and a little or with not much (There isn't much milk.). How many stays with plurals. Here How much asks about an amount, not a price; prices come back in 5.8. The photos show a full bottle or jug against one with a finger's width at the bottom.",
  "prerequisite": "A1 5.4 How many … are there?; A1+ 5.1 a lot of, a few; A1+ 5.2 a little; A1+ 4.4 Is there…?, there isn't; A1 5.3 milk, juice.",
