  "grammar_function": "A follow-up of A1 5.14 At the Table: A1 names things at the table (salt, sugar, cup, glass, bottle, plate, cake) and says what a cup or a glass holds (a cup of tea); A1+ 5.14 asks for something at the table with Can you pass the …, please?, a request answered by A1 5.9's Here you are., and adds a piece of for part of a cake, next to 5.3's Would you like …? and 5.9's I'd like …. Can is a request here, not ability. In each photo one cast member hands a thing across the table to the one who asks; the asker's voice always differs from the giver's. On 2026-11-23 fork, knife and spoon were added, each named on its own photo and then asked for at the table, and 5.2's butter comes back.",
  "prerequisite": "A1 5.14 salt, sugar, cake, of; A1 5.9 Here you are.; A1 5.2-5.3 bread, water; A1+ 5.3 Would you like …?; A1+ 5.9 I'd like ….",
  "speaking_outcome": "Join Can you pass as one group (kn-you-PASS) and say a piece of with of short (a-PEE-suv); do not require native-like speed.",
