  "grammar_function": "A follow-up of A1 6.7 Which Side of the Street?: A1 finds a place on the left or on the right; A1+ 6.7 turns at a place. The new grammar relationship is at + a landmark after A1 6.8's turn left / turn right (Turn left at the bakery.), with 6.1's new places as landmarks and A1 6.10's How do I get to …?. Every photo is seen from behind one walker at a crossroads who points one whole arm along the side street that goes past the named place, which stands on that corner; the other corner is a plain office building. Two new words name where to turn when there is no shop: traffic light and crosswalk (Turn left at the traffic light. / Turn right at the crosswalk.); each is one photo with that landmark on the pointed side and no shop, and the crosswalk photo is never a picture choice, because other crossroads show road lines.",
  "prerequisite": "A1 6.7 left and right; A1 6.8 turn left/right, go straight; A1 6.10 How do I get to…?; A1+ 6.1 places.",
  "speaking_outcome": "Link turn left at (turn-LEFT-at). Do not require native-like speed. Stress TRAF-fic light and CROSS-walk.",
