      "prompt_image_url": "",
      "spanish_translation": "Do you work?",
      "pedagogy_note": "One connected conversation with the established adults. Keep the asker, respondent, clothes and setting consistent within each question/reply pair. Later park exchanges retrieve the familiar place and actions. Images support the topic; explicit spoken replies establish yes or no, never inferred from a person working, studying or being in a park.\nFocus on auxiliary Do at the start of the question and do / do not in the reply. Do helps form the question; it does not name a separate action. No bare-action Learn cards, no go-to-work travel contrast, and no new free-conversation mechanic.\nExchange 1: introduce the full question, then continue directly to its reply on the next card. Emphasize Do as the question auxiliary. Working, studying, playing and running were taught as action meanings in Unit 1. Declare work, study, play and run as their base forms in this draft; do not silently treat those surface forms as previously taught or waive the language audit.",
