name: Publish SpanGlish Preview

on:
  workflow_dispatch:
    inputs:
      message:
        description: Short description shown in Expo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spanglish-preview-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: Require the dedicated release branch
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Reject every other ref
        shell: pwsh
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_EVENT: ${{ github.event_name }}
        run: |
          if ($env:DISPATCH_EVENT -cne 'workflow_dispatch') {
            throw "Preview publication must be manually dispatched."
          }
          if ($env:DISPATCH_REF -cne 'refs/heads/release/preview') {
            throw "Preview publication is allowed only from refs/heads/release/preview."
          }
          if ($env:DISPATCH_REF_PROTECTED -cne 'true') {
            throw "release/preview must be protected by a branch rule or ruleset."
          }

  publish:
    name: Verify and publish exact commit
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: preview-release
    env:
      CI: 'true'
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact commit with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify versioned release integrity
        shell: pwsh
        run: node mobile/scripts/verify-release-integrity.cjs --repository-root .

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt

      - name: Install mobile dependencies
        working-directory: mobile
        shell: pwsh
        run: npm ci

      - name: Run backend test suite
        shell: pwsh
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Run complete Preview verification
        working-directory: mobile
        shell: pwsh
        run: npm run verify:preview

      - name: Set up authenticated EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish and verify the exact GitHub commit
        working-directory: mobile
        shell: pwsh
        env:
          RELEASE_MESSAGE: ${{ inputs.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHARED_BACKEND_STATUS_URL: https://learnenglish-fxki.onrender.com/api/release/status
        run: .\scripts\publish-preview.ps1 -Message $env:RELEASE_MESSAGE
