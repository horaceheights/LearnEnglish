name: Preview release integrity

on:
  pull_request:
    branches:
      - release/preview
  push:
    branches:
      - release/preview

permissions:
  contents: read

concurrency:
  group: preview-release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify complete Preview candidate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify versioned release integrity
        shell: pwsh
        run: node mobile/scripts/verify-release-integrity.cjs --repository-root .

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt

      - name: Install mobile dependencies
        working-directory: mobile
        shell: pwsh
        run: npm ci

      - name: Run backend test suite
        shell: pwsh
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Run complete Preview verification
        working-directory: mobile
        shell: pwsh
        run: npm run verify:preview
