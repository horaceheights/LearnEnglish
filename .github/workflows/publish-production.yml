name: Publish SpanGlish Production

on:
  workflow_dispatch:
    inputs:
      group_id:
        description: Exact Expo Preview Group ID approved by the user
        required: true
        type: string
      confirmed:
        description: I have explicit approval to publish this tested Preview to Production
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: spanglish-production-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: Require protected main and explicit confirmation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Reject every unauthorized publication
        shell: pwsh
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_EVENT: ${{ github.event_name }}
          PRODUCTION_CONFIRMED: ${{ inputs.confirmed }}
        run: |
          if ($env:DISPATCH_EVENT -cne 'workflow_dispatch') {
            throw "Production publication must be manually dispatched."
          }
          if ($env:DISPATCH_REF -cne 'refs/heads/main') {
            throw "Production publication is allowed only from refs/heads/main."
          }
          if ($env:DISPATCH_REF_PROTECTED -cne 'true') {
            throw "main must be protected by a branch rule or ruleset."
          }
          if ($env:PRODUCTION_CONFIRMED -cne 'true') {
            throw "Production publication requires explicit confirmation."
          }

  publish:
    name: Verify and publish tested Preview to Production
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 90
    # The existing CI-only Expo token currently lives in this protected
    # environment. Its branch policy is restricted to main.
    environment:
      name: preview-release
    env:
      CI: 'true'
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact commit with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify versioned release integrity
        shell: pwsh
        run: node mobile/scripts/verify-release-integrity.cjs --repository-root .

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt

      - name: Install mobile dependencies
        working-directory: mobile
        shell: pwsh
        run: npm ci

      - name: Run backend test suite
        shell: pwsh
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Run strict Production verification
        working-directory: mobile
        shell: pwsh
        run: npm run verify:production

      - name: Set up authenticated EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Republish and verify the exact approved Preview group
        working-directory: mobile
        shell: pwsh
        env:
          APPROVED_PREVIEW_GROUP: ${{ inputs.group_id }}
          PRODUCTION_CONFIRMATION: PUBLISH PRODUCTION
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHARED_BACKEND_STATUS_URL: https://learnenglish-fxki.onrender.com/api/release/status
        run: .\scripts\promote-preview.ps1 -GroupId $env:APPROVED_PREVIEW_GROUP -Confirmation $env:PRODUCTION_CONFIRMATION
