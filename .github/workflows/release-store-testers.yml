name: Release SpanGlish Store Testers

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build binaries, verify IDs for console upload, or submit with EAS
        required: true
        type: choice
        default: build
        options: [build, verify, submit]
      platform:
        description: Platforms to build or submit (select one to retry a partial release)
        required: true
        type: choice
        default: all
        options: [all, android, ios]
      android_build_id:
        description: Verified production Android build ID (verify/submit only)
        type: string
      ios_build_id:
        description: Verified production iOS build ID (verify/submit only)
        type: string
      group_id:
        description: Exact tested and approved Preview group (verify/submit only)
        type: string
      confirmed:
        description: User approved this exact tested Preview for the existing store tester tracks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spanglish-production-publication
  cancel-in-progress: false

jobs:
  authorize:
    name: Require protected main and submission approval
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Reject unauthorized release
        shell: pwsh
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_PROTECTED: ${{ github.ref_protected }}
          DISPATCH_EVENT: ${{ github.event_name }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_CONFIRMED: ${{ inputs.confirmed }}
        run: |
          if ($env:DISPATCH_EVENT -cne 'workflow_dispatch' -or
              $env:DISPATCH_REF -cne 'refs/heads/main' -or
              $env:DISPATCH_REF_PROTECTED -cne 'true') {
            throw 'Store release requires manually dispatched protected main.'
          }
          if ($env:RELEASE_ACTION -ne 'build' -and $env:RELEASE_CONFIRMED -cne 'true') {
            throw 'Store submission requires explicit approval of the exact tested Preview.'
          }

  release:
    name: Verify and release native tester builds
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 180
    environment:
      name: preview-release
    env:
      CI: 'true'
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact commit with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify versioned release integrity
        shell: pwsh
        run: node mobile/scripts/verify-release-integrity.cjs --repository-root .

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt

      - name: Verify every Cloudflare course media and audio object
        shell: pwsh
        run: python scripts/verify_cloudflare_media.py

      - name: Install mobile dependencies
        working-directory: mobile
        shell: pwsh
        run: npm.cmd ci

      - name: Run backend test suite
        shell: pwsh
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Verify complete store release candidate
        working-directory: mobile
        shell: pwsh
        run: npm.cmd run verify:production

      - name: Set up authenticated EAS CLI
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build or submit verified native tester binaries
        working-directory: mobile
        shell: pwsh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          ANDROID_BUILD_ID: ${{ inputs.android_build_id }}
          IOS_BUILD_ID: ${{ inputs.ios_build_id }}
          APPROVED_PREVIEW_GROUP: ${{ inputs.group_id }}
          RELEASE_CONFIRMED: ${{ inputs.confirmed }}
        run: |
          .\scripts\release-store-testers.ps1 -Action $env:RELEASE_ACTION -Platform $env:RELEASE_PLATFORM `
            -AndroidBuildId $env:ANDROID_BUILD_ID -IosBuildId $env:IOS_BUILD_ID `
            -GroupId $env:APPROVED_PREVIEW_GROUP -Confirmation $env:RELEASE_CONFIRMED
