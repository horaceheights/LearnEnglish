services:
  - type: web
    name: learnenglish
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRONUNCIATION_PROVIDER
        value: azure
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: mexicocentral
      - key: AZURE_SPEECH_LOCALE
        value: en-US
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: coral
      - key: OPENAI_TTS_FORMAT
        value: mp3
      - key: ALLOWED_ORIGINS
        value: https://learn-english-orcin.vercel.app,https://learn-english-horaio-gutierrezs-projects.vercel.app,https://learn-english-git-main-horaio-gutierrezs-projects.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      - key: SENTRY_ENVIRONMENT
        value: production
